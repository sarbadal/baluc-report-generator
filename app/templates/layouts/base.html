<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block page_title %}BaluC{% endblock %}</title>
    <script>
      (function () {
        var savedTheme = localStorage.getItem("baluc-theme");
        var preferredDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = savedTheme === "dark" || savedTheme === "light" ? savedTheme : (preferredDark ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="{{ static_asset('favicon-32x32.png') }}?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="{{ static_asset('favicon-16x16.png') }}?v=2" />
    <link rel="icon" type="image/x-icon" href="{{ static_asset('favicon.ico') }}?v=2" />
    <link rel="shortcut icon" href="{{ static_asset('favicon.ico') }}?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="{{ static_asset('apple-touch-icon.png') }}?v=2" />
    <link rel="stylesheet" href="{{ static_asset('css/global.css') }}" />
    {% block styles %}{% endblock %}
  </head>
  <body>
    {% include "components/global/header.html" %}
    <div class="app-main">{% block body %}{% endblock %}</div>
    {% include "components/global/footer.html" %}
    <script src="{{ static_asset('js/theme.js') }}" defer></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
