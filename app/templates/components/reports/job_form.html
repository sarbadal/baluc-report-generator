<article class="card composer">
  <h2>Create a Report Job</h2>
  <p class="hint">Pick a start and end date, then submit.</p>

  <form method="post" class="grid">
    <div class="field field-start">
      <label for="start_date">Start Date</label>
      <input id="start_date" name="start_date" type="date" value="{{ form_data.start_date }}" required />
    </div>
    <div class="field field-end">
      <label for="end_date">End Date</label>
      <input id="end_date" name="end_date" type="date" value="{{ form_data.end_date }}" required />
    </div>
    <button type="submit" class="submit-compact">Generate</button>
  </form>

  {% if submitted_report_id %}
  <div class="success">Submitted successfully. Tracking ID: {{ submitted_report_id }}</div>
  {% endif %}

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
</article>
