{% extends "layouts/base.html" %}

{% block page_title %}Sign In | BaluC{% endblock %}

{% block body_class %}auth-body{% endblock %}

{% block styles %}
  <link rel="stylesheet" href="{{ static_asset('css/auth.css') }}" />
{% endblock %}

{% block body %}
  <main class="auth-page" aria-labelledby="auth-title">
    <section class="auth-panel">
      <p class="auth-kicker">Protected Workspace</p>
      <h1 id="auth-title">Enter app password</h1>
      <form class="auth-form" method="post" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="next" value="{{ next_url }}" />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" autofocus required />
        {% if error %}
          <p class="auth-error" role="alert">{{ error }}</p>
        {% endif %}
        <button type="submit">Continue</button>
      </form>
    </section>
  </main>
{% endblock %}
